project_id = "english-pathway"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

# OAuth providers for local development. Set enabled = true after adding
# GOOGLE_* / GITHUB_* to .env.local (names must not start with SUPABASE_).
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[auth.external.github]
enabled = false
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"

[auth.email]
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false
